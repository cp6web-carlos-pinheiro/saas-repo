name: beyond-mrp

x-app-environment: &app-environment
  APP_NAME: Beyond MRP
  APP_ENV: local
  APP_KEY: ${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  APP_DEBUG: "true"
  APP_URL: http://localhost:${APP_HTTP_PORT:-8000}
  APP_LOCALE: pt_BR
  APP_FALLBACK_LOCALE: en
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: beyond_mrp
  DB_USERNAME: beyond_mrp
  DB_PASSWORD: beyond_mrp_local
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  CACHE_STORE: redis
  CACHE_PREFIX: beyond_mrp
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  MAIL_MAILER: smtp
  MAIL_SCHEME: null
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_USERNAME: null
  MAIL_PASSWORD: null
  MAIL_FROM_ADDRESS: no-reply@beyond-mrp.local
  MAIL_FROM_NAME: Beyond MRP
  HOME: /tmp
  COMPOSER_HOME: /tmp/composer
  COMPOSER_CACHE_DIR: /tmp/composer-cache

x-app-volumes: &app-volumes
  - ../../../www:/var/www/html
  - composer_vendor:/var/www/html/vendor
  - node_modules:/var/www/html/node_modules
  - laravel_storage:/var/www/html/storage
  - bootstrap_cache:/var/www/html/bootstrap/cache

services:
  web:
    container_name: beyond-mrp-web
    build:
      context: web
      dockerfile: Dockerfile
    environment:
      <<: *app-environment
      VITE_HMR_HOST: localhost
      VITE_HMR_CLIENT_PORT: ${VITE_PORT:-5174}
      VITE_DEV_SERVER_URL: http://localhost:${VITE_PORT:-5174}
      VITE_PORT: 5173
    volumes: *app-volumes
    ports:
      - "${APP_HTTP_PORT:-8000}:8080"
      - "${VITE_PORT:-5174}:5173"
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    container_name: beyond-mrp-worker
    build:
      context: web
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: >-
      sh -lc "until [ -f /var/www/html/vendor/autoload.php ]; do sleep 2; done;
      exec /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord-worker.conf"
    environment:
      <<: *app-environment
    volumes: *app-volumes
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  mysql:
    container_name: beyond-mrp-mysql
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: beyond_mrp
      MYSQL_USER: beyond_mrp
      MYSQL_PASSWORD: beyond_mrp_local
      MYSQL_ROOT_PASSWORD: beyond_mrp_root_local
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: beyond-mrp-redis
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    container_name: beyond-mrp-mailpit
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_HTTP_PORT:-8026}:8025"
    networks:
      - app

networks:
  app:
    name: beyond-mrp-network

volumes:
  mysql_data:
    name: beyond-mrp-mysql-data
  redis_data:
    name: beyond-mrp-redis-data
  composer_vendor:
    name: beyond-mrp-composer-vendor
  node_modules:
    name: beyond-mrp-node-modules
  laravel_storage:
    name: beyond-mrp-laravel-storage
  bootstrap_cache:
    name: beyond-mrp-bootstrap-cache
